/* Dashboard design system. Keep the map, panels and controls on one calm palette. */
:root{
  --factory:#e58a3b;
  --factory-dark:#c96d25;
  --dock:#0f766e;
  --dock-dark:#115e59;
  --cluster:#1e3a8a;
  --surface:#f9fafb;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#e8edf1;
  --glass:rgba(255,255,255,.85);
  --shadow:0 16px 50px rgba(24,47,60,.14);
  color:var(--text);
  background:var(--surface);
}
:focus-visible{outline:2px solid var(--dock);outline-offset:2px}
.button--primary{background:var(--dock);box-shadow:0 8px 22px rgba(15,118,110,.18)}
.button--primary:hover:not(:disabled){background:var(--dock-dark);box-shadow:0 10px 25px rgba(15,118,110,.25)}
.button--outline{border-color:#c9dfdb;background:#f3f9f7;color:var(--dock)}
.button--ghost{border-color:var(--line);color:var(--text)}
.icon-button{border-color:transparent;background:rgba(249,250,251,.85);color:#475569}
.icon-button:hover{border-color:#d7e6e3;background:#edf7f5;color:var(--dock)}

.app-shell{background:var(--surface)}
.panel{
  z-index:500;
  flex:0 0 376px;
  height:calc(100% - 28px);
  margin:14px 0 14px 14px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.8);
  border-radius:22px;
  background:var(--glass);
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.panel-top{
  height:72px;
  padding:0 18px;
  border-bottom:1px solid rgba(231,237,240,.7);
  background:rgba(255,255,255,.45);
}
.panel-brand{gap:9px;min-width:0}
.panel-brand>span:last-child{min-width:0}
.panel-brand__icon{width:36px;height:36px;flex:0 0 auto;border-radius:11px;background:#e8f4f1;color:var(--dock)}
.panel-brand__icon svg{width:26px;height:26px}
.panel-brand strong{overflow:hidden;color:var(--text);font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.panel-brand__eyebrow{color:var(--dock);font-size:8px;letter-spacing:.08em}
.panel-top__actions{display:flex;align-items:center;flex:0 0 auto;gap:5px;margin-left:5px}
.role-label{max-width:66px;padding:5px 7px;border-radius:99px;background:#e8f5f2;color:var(--dock-dark);font-size:10px;font-weight:750;text-align:center}
.logout-button{padding:7px 4px;color:var(--muted);font-size:11px;white-space:nowrap}
.logout-button:hover{color:var(--dock)}
.panel-close{width:30px;height:30px;border-radius:9px;font-size:24px}
.panel-body{padding:20px 18px 0;scrollbar-color:#cbd5d6 transparent}
.panel-heading{margin-bottom:15px}
.panel-heading h2{margin:4px 0 4px;color:var(--text);font-size:20px;font-weight:700;letter-spacing:-.025em}
.panel-subtitle{color:var(--muted);font-size:12px}
.section-eyebrow{color:var(--dock);font-size:9px;letter-spacing:.13em}
.refresh-button{width:32px;height:32px;margin-top:3px;font-size:20px}
.search-box{height:42px;border:1px solid transparent;border-radius:12px;background:#f2f4f6;color:#8b97a4;transition:border-color .18s,background .18s,box-shadow .18s}
.search-box:focus-within{border-color:var(--dock);background:#fff;box-shadow:0 0 0 2px rgba(15,118,110,.09)}
.search-box input{color:var(--text);font-size:12px}
.search-box input::placeholder{color:#9aa4af}
.tabs{gap:3px;margin:14px 0 15px;padding:4px;border-radius:999px;background:#f0f3f5}
.tab{min-height:33px;gap:6px;border-radius:999px;color:#6b7280;font-size:11px;transition:background .18s,color .18s,box-shadow .18s}
.tab:hover{color:var(--dock)}
.tab.is-active,.tab[aria-pressed="true"]{background:#fff;color:var(--dock-dark);box-shadow:0 2px 8px rgba(31,41,55,.08)}
.tab-symbol{display:inline-block;width:8px;height:8px;flex:0 0 auto;border-radius:3px;background:var(--factory)}
.tab-symbol--dock{border-radius:50%;background:var(--dock)}
.filter-heading{margin-bottom:9px;color:#475569;font-size:11px}
.filter-heading__hint{color:#a3adb8}
.city-chips{
  display:flex;
  flex:0 0 auto;
  flex-wrap:nowrap;
  gap:7px;
  min-height:31px;
  max-width:100%;
  margin-bottom:14px;
  padding:0 0 3px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  white-space:nowrap;
  scroll-snap-type:x proximity;
}
.city-chips::-webkit-scrollbar{display:none}
.city-chips button,.city-chip{flex:0 0 auto;min-height:27px;border-color:#e2e8eb;background:#fff;color:#687782;scroll-snap-align:start}
.city-chips button:hover,.city-chip:hover{border-color:#a5d0ca;color:var(--dock)}
.city-chips button.is-active,.city-chips button[aria-pressed="true"],.city-chip.is-active{border-color:#a6d6cd;background:#e7f4f0;color:var(--dock-dark)}
.results-heading{padding-top:11px;border-top:1px solid var(--line);color:#94a3b0}
.results-heading strong{color:var(--text);font-size:12px}
.result-list{gap:8px;padding-bottom:18px}
.result-card{
  padding:12px 13px;
  border:1px solid #f0f0f0;
  border-radius:12px;
  background:rgba(255,255,255,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.02);
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease;
}
.result-card:hover{transform:translateY(-2px);border-color:#e0e9e9;background:#fcfdfd;box-shadow:0 9px 22px rgba(27,48,55,.09)}
.result-card.is-active{border-color:#9ccdc7;background:#f2faf8;box-shadow:0 7px 20px rgba(15,118,110,.10)}
.result-card__name{color:var(--text);font-size:12px}
.result-card__icon{border-radius:9px;background:#fff0e1;color:var(--factory-dark)}
.result-card--dock .result-card__icon{background:#e2f3f0;color:var(--dock)}
.result-card__icon::before{width:14px;height:13px;border-radius:4px;background:var(--factory);content:""}
.result-card--dock .result-card__icon::before{width:15px;height:15px;border-radius:0;background:var(--dock);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.result-card__meta,.result-card__address{color:#81909d}
.result-card__tag{background:#eef5f3;color:var(--dock-dark)}
.panel-footer{
  min-height:39px;
  padding:10px 18px;
  border-top:1px solid rgba(231,237,240,.75);
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.status-text{margin:0;color:#8996a1;font-size:10px}
.sheet-handle{display:none}

.map{background:#e9f0ea}
.map .leaflet-tile-pane{filter:saturate(.85) contrast(1.05)}
.map .leaflet-container{font-family:inherit}
.leaflet-popup-content-wrapper{border-radius:15px;box-shadow:0 16px 34px rgba(17,46,57,.18)}
.leaflet-popup-content h3{color:var(--text)}
.panel-open{border-color:rgba(255,255,255,.85);border-radius:12px;background:rgba(255,255,255,.88);color:var(--dock-dark);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.map-fab{
  position:absolute;
  z-index:650;
  right:24px;
  bottom:104px;
  display:grid;
  place-items:center;
  width:58px;
  height:58px;
  padding:0;
  border:1px solid rgba(255,255,255,.75);
  border-radius:50%;
  background:var(--dock);
  color:#fff;
  box-shadow:0 10px 25px rgba(15,75,77,.3),0 3px 8px rgba(31,41,55,.12);
  font-size:35px;
  font-weight:300;
  line-height:1;
  transition:transform .2s ease,background .2s ease,box-shadow .2s ease;
}
.map-fab:hover{transform:translateY(-3px);background:var(--dock-dark);box-shadow:0 14px 30px rgba(15,75,77,.34)}
.map-fab:active{transform:translateY(-1px) scale(.97)}
.map-fab span{display:block;transform:translateY(-2px)}

/* Simplified point symbols and readable map clusters. */
.location-div-icon,.location-cluster-icon{border:0!important;background:transparent!important}
.location-marker{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:0;background:transparent;color:inherit;filter:drop-shadow(0 4px 5px rgba(28,53,63,.24));box-shadow:none}
.location-marker.dock{background:transparent}
.location-marker:hover{transform:translateY(-2px) scale(1.08);box-shadow:none}
.location-marker svg{display:none}
.marker-shape{position:relative;display:block;width:30px;height:27px;border:2px solid #fff;border-radius:8px;background:var(--factory);box-shadow:0 0 0 1px rgba(128,68,16,.1)}
.location-marker.dock .marker-shape,.location-marker--dock .marker-shape{width:32px;height:32px;border:0;border-radius:0;background:#fff;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.location-marker.dock .marker-shape::after,.location-marker--dock .marker-shape::after{position:absolute;inset:3px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);background:var(--dock);content:""}
.marker-count{top:-5px;right:-7px;border-color:#fff;background:var(--cluster);box-shadow:0 2px 7px rgba(30,58,138,.24)}
.cluster-bubble{
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
  border:3px solid #fff;
  border-radius:50%;
  background:var(--cluster);
  color:#fff;
  box-shadow:0 4px 12px rgba(18,43,76,.32);
  font-size:13px;
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1;
  text-shadow:0 1px 2px rgba(0,0,0,.13);
  transition:transform .18s ease,box-shadow .18s ease;
}
.cluster-bubble:hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(18,43,76,.36)}
.cluster-bubble--dock{background:var(--dock)}

.modal-backdrop{background:rgba(16,32,39,.52)}
.editor-card{border-color:rgba(255,255,255,.8);border-radius:20px;box-shadow:0 25px 70px rgba(16,32,39,.25)}
.editor-header h2{color:var(--text)}
.editor-footer{background:rgba(249,250,251,.88)}
.field input:focus,.field select:focus,.login-form input:focus{border-color:var(--dock);box-shadow:0 0 0 3px rgba(15,118,110,.1)}
.toast{border-color:#2e6f69;background:#134d48}

@media(max-width:800px){
  .panel{flex-basis:352px}
  .panel-top{padding-inline:14px}
  .panel-body{padding-inline:15px}
  .panel-footer{padding-inline:15px}
}
@media(max-width:767px){
  .app-shell{display:block}
  .map{position:absolute;inset:0 auto auto 0;width:100%;height:50vh;height:50dvh}
  .panel{
    position:absolute;
    inset:auto 0 0;
    z-index:600;
    width:100%;
    height:50vh;
    height:50dvh;
    max-height:94vh;
    max-height:94dvh;
    margin:0;
    border-radius:24px 24px 0 0;
    box-shadow:0 -12px 36px rgba(16,43,51,.22);
    transition:height .28s cubic-bezier(.2,.8,.2,1);
  }
  .panel.is-expanded{height:88vh;height:88dvh}
  .panel.is-expanded ~ .map{height:12vh;height:12dvh}
  .panel.is-collapsed ~ .map{height:100vh;height:100dvh}
  .sheet-handle{display:grid;place-items:center;flex:0 0 22px;width:100%;height:22px;padding:0;border:0;background:transparent;touch-action:none;cursor:ns-resize}
  .sheet-handle span{display:block;width:38px;height:4px;border-radius:99px;background:#c4d0d4}
  .sheet-handle:hover span{background:#91bdb7}
  .panel-top{height:53px;padding:0 15px}
  .panel-body{padding-top:13px}
  .panel-heading{margin-bottom:11px}
  .panel-heading h2{font-size:18px}
  .panel-subtitle{font-size:11px}
  .tabs{margin:11px 0 12px}
  .city-chips{margin-bottom:10px}
  .panel-footer{min-height:32px;padding-top:7px;padding-bottom:7px}
  .map-fab{right:18px;bottom:calc(50vh + 18px);bottom:calc(50dvh + 18px);width:54px;height:54px;font-size:33px}
  .panel.is-expanded ~ .map-fab{top:14px;bottom:auto}
  .panel.is-collapsed ~ .map-fab{top:auto;bottom:22px}
  .panel-open{top:auto;bottom:20px;left:16px}
  .leaflet-control-zoom{display:none!important}
}
@media(max-width:480px){
  .panel{width:100%}
  .panel-brand__icon{width:32px;height:32px}
  .panel-brand__icon svg{width:24px;height:24px}
  .panel-brand strong{font-size:12px}
  .panel-brand__eyebrow{font-size:7px}
  .panel-top__actions{gap:3px}
  .role-label{max-width:52px;padding-inline:5px;font-size:9px}
  .logout-button{font-size:10px}
  .panel-close{width:28px;height:28px}
  .panel-body{padding-top:13px}
  .panel-heading h2{font-size:18px}
}

    cityChips: $('cityChips'), resultCount: $('resultCount'), resultList: $('resultList'),
    statusText: $('statusText'), refreshBtn: $('refreshBtn'), addBtn: $('addBtn'),
    logoutBtn: $('logoutBtn'), roleLabel: $('roleLabel'),
    editorOverlay: $('editorOverlay'), editorForm: $('editorForm'), editorTitle: $('editorTitle'),
    editorError: $('editorError'), editorCancel: $('editorCancel'), editorSubmit: $('editorSubmit'),
    editorType: $('editorType'), editorId: $('editorId'), pickPointBtn: $('pickPointBtn'),
    factoryFields: $('factoryFields'), dockFields: $('dockFields'), toast: $('toast')
  };
  const field = {
    name: $('fieldName'), city: $('fieldCity'), county: $('fieldCounty'),
    address: $('fieldAddress'), lng: $('fieldLng'), lat: $('fieldLat'),
    abbreviation: $('fieldAbbreviation'), group_name: $('fieldGroupName'),
    capacity: $('fieldCapacity'), soybean_meal_demand: $('fieldSoybeanMealDemand'),
    soybean_meal_origin: $('fieldSoybeanMealOrigin'), delivery_channel: $('fieldDeliveryChannel'),
    freight_per_ton: $('fieldFreightPerTon'), Contact: $('fieldContact'),
    berth: $('fieldBerth'), berth_tonnage: $('fieldBerthTonnage')
  };

  let client;
  let map;
  let gxBounds;
  let markerLayer;
  let records = [];
  let recordByKey = new Map();
  let markerByKey = new Map();
  let columns = { factory: [...EXPECTED_COLUMNS.factory], dock: [...EXPECTED_COLUMNS.dock] };
  let typeFilter = 'all';
  let cityFilter = '';
  let role = 'none';
  let editing = null;
  let pointPicking = false;
  let toastTimer;
  let loading = false;
  let provincePolygons;
  let sheetPointerStart = null;
  let sheetDidSwipe = false;

  function text(value) { return value == null ? '' : String(value).trim(); }
  function normalizedColumn(value) { return text(value).toLowerCase().replace(/[\s_-]+/g, ''); }
  function findColumn(object, name) {
    const target = normalizedColumn(name);
    return Object.keys(object).find(key => normalizedColumn(key) === target);
  }
  function read(object, name) {
    const key = findColumn(object, name);
    return key ? object[key] : null;
  }
  function coordsFromRow(raw) {
    const combined = read(raw, 'Latitude_and_longitude');
    const pair = text(combined).match(/^\s*(-?\d+(?:\.\d+)?)\s*[,，;；\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (pair) return { lng: Number(pair[1]), lat: Number(pair[2]) };
    const lngValue = read(raw, 'lng') ?? read(raw, 'longitude');
    const latValue = read(raw, 'lat') ?? read(raw, 'latitude');
    return { lng: text(lngValue) === '' ? NaN : Number(lngValue),
      lat: text(latValue) === '' ? NaN : Number(latValue) };
  }
  function pointInRing(lng, lat, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      const cross = (lng - xi) * (yj - yi) - (lat - yi) * (xj - xi);
      if (Math.abs(cross) < 1e-10 && lng >= Math.min(xi, xj) - 1e-10 &&
          lng <= Math.max(xi, xj) + 1e-10 && lat >= Math.min(yi, yj) - 1e-10 &&
          lat <= Math.max(yi, yj) + 1e-10) return true;
      if ((yi > lat) !== (yj > lat) &&
          lng < xi + (lat - yi) * (xj - xi) / (yj - yi)) inside = !inside;
    }
    return inside;
  }
  function isInGuangxi(lng, lat) {
    if (!Number.isFinite(lng) || !Number.isFinite(lat)) return false;
    if (!provincePolygons) {
      const geometry = window.GUANGXI_BOUNDARY?.features?.[0]?.geometry;
      if (!geometry) return false;
      provincePolygons = geometry.type === 'MultiPolygon'
        ? geometry.coordinates : [geometry.coordinates];
    }
    return provincePolygons.some(polygon =>
      pointInRing(lng, lat, polygon[0]) &&
      !polygon.slice(1).some(hole => pointInRing(lng, lat, hole)));
  }
  function inferCity(address) {
    return CITIES.find(city => text(address).includes(city)) || '其他地区';
  }
  function normalize(raw, type) {
    const { lng, lat } = coordsFromRow(raw);
    const id = read(raw, 'id');
    if (id == null || text(id) === '') return null;
    const valid = isInGuangxi(lng, lat);
    const address = text(read(raw, 'address'));
    const city = type === 'factory' ? text(read(raw, 'city')) || '其他地区' : inferCity(address);
    return {
      key: `${type}:${String(id)}`, id, type, raw,
      lng: valid ? lng : null, lat: valid ? lat : null, valid, city, address,
      name: text(read(raw, 'name')) || '未命名地点',
      county: type === 'factory' ? text(read(raw, 'county')) : '',
      abbreviation: text(read(raw, 'abbreviation')),
      groupName: text(read(raw, 'group_name')),
      capacity: read(raw, 'capacity')
    };
  }

  function showToast(message, isError = false) {
    el.toast.textContent = message;
    el.toast.classList.toggle('is-error', isError);
    el.toast.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('is-visible'), 4200);
  }
  function showLoginError(message) {
    el.loginError.textContent = message;
    el.loginError.hidden = false;
  }
  function status(message) { el.statusText.textContent = message; }
  function setLoading(value) {
    loading = value;
    el.refreshBtn.disabled = value;
    el.addBtn.disabled = value;
    if (value) status('正在同步数据…');
  }
  function friendlyError(error) {
    const message = text(error && error.message) || '未知错误';
    if (/Invalid login credentials/i.test(message)) return '账号或密码错误。';
    if (error && error.code === '42501') return '数据库拒绝此操作，请检查账号权限和 RLS 策略。';
    if (error && error.code === '23505') return '编号重复，请刷新后重试。';
    if (/Failed to fetch|NetworkError/i.test(message)) return '网络连接失败，请检查网络后重试。';
    return message;
  }

  function initMap() {
    if (map) return;
    const minimumZoom = window.innerWidth < 768 ? 5 : 6;
    const boundary = window.GUANGXI_BOUNDARY;
    if (!boundary || !boundary.features || !boundary.features.length) {
      throw new Error('缺少广西边界文件 guangxi-boundary.js。');
    }
    const feature = boundary.features[0];
    const polygons = feature.geometry.type === 'MultiPolygon'
      ? feature.geometry.coordinates : [feature.geometry.coordinates];
    const ringToLatLng = ring => ring.map(point => [point[1], point[0]]);
    const outerRings = polygons.map(polygon => ringToLatLng(polygon[0]));

    map = L.map('map', {
      zoomControl: false, preferCanvas: true, zoomSnap: 0.25,
      minZoom: minimumZoom, maxZoom: 18, maxBoundsViscosity: 1,
      attributionControl: true
    });
    map.createPane('outsideMask');
    map.getPane('outsideMask').style.zIndex = 410;
    map.createPane('provinceBorder');
    map.getPane('provinceBorder').style.zIndex = 420;
    const outline = L.geoJSON(boundary, {
      pane: 'provinceBorder', interactive: false,
      style: { color: '#0f766e', weight: 2, opacity: 0.95, fillOpacity: 0 }
    }).addTo(map);
    gxBounds = outline.getBounds();
    if (!gxBounds.isValid()) throw new Error('广西边界坐标无效。');
    const tileBounds = gxBounds.pad(0.03);
    L.tileLayer(
      'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      { subdomains: '1234', bounds: tileBounds, noWrap: true, minZoom: minimumZoom, maxZoom: 18,
        attribution: '底图 © 高德地图 · 边界 © 阿里云 DataV GeoAtlas' }
    ).addTo(map);
    // 把广西之外的瓦片盖住。MultiPolygon 的各块（包括沿海岛屿）均作为孔保留。
    const worldRing = [[-85, -180], [-85, 180], [85, 180], [85, -180]];
    L.polygon([worldRing, ...outerRings], {
      pane: 'outsideMask', stroke: false, interactive: false,
      fillColor: '#e9eef3', fillOpacity: 1, fillRule: 'evenodd'
    }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    markerLayer = L.markerClusterGroup({
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      spiderfyOnMaxZoom: true,
      spiderfyDistanceMultiplier: 1.3,
      maxClusterRadius: zoom => zoom >= 13 ? 28 : 48,
      iconCreateFunction: cluster => L.divIcon({
        className: 'location-cluster-icon',
        html: `<span class="cluster-bubble">${cluster.getChildCount()}</span>`,
        iconSize: [44, 44], iconAnchor: [22, 22]
      })
    }).addTo(map);
    map.setMaxBounds(gxBounds.pad(0.08));
    fitProvince();
    map.on('click', event => {
      if (!pointPicking) return;
      if (!isInGuangxi(event.latlng.lng, event.latlng.lat)) {
        showToast('请在广西范围内选择地点。', true);
        return;
      }
      field.lng.value = event.latlng.lng.toFixed(6);
      field.lat.value = event.latlng.lat.toFixed(6);
      pointPicking = false;
      $('map').classList.remove('is-picking');
      el.editorOverlay.hidden = false;
      showToast('坐标已填入表单。');
    });
  }
  function fitProvince() {
    if (!map || !gxBounds) return;
    map.fitBounds(gxBounds, {
      paddingTopLeft: [28, 35],
      paddingBottomRight: [28, 35], maxZoom: 9, animate: false
    });
  }

  async function fetchTable(table) {
    const output = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await client.from(table).select('*').order('id').range(from, from + 999);
      if (error) throw error;
      output.push(...(data || []));
      if (!data || data.length < 1000) return output;
    }
  }
  async function refreshData({ quiet = false } = {}) {
    if (loading) return;
    setLoading(true);
    try {
      const [factories, docks] = await Promise.all([
        fetchTable(FACTORY_TABLE), fetchTable(DOCK_TABLE)
      ]);
      columns = {
        factory: factories.length ? Object.keys(factories[0]) : [...EXPECTED_COLUMNS.factory],
        dock: docks.length ? Object.keys(docks[0]) : [...EXPECTED_COLUMNS.dock]
      };
      const combined = [
        ...factories.map(row => normalize(row, 'factory')),
        ...docks.map(row => normalize(row, 'dock'))
      ];
      records = combined.filter(Boolean);
      recordByKey = new Map(records.map(record => [record.key, record]));
      renderChips();
      render();
      const missingId = combined.length - records.length;
      const invalidCoords = records.filter(record => !record.valid).length;
      status(`已同步 ${records.length} 个地点${invalidCoords ? ` · ${invalidCoords} 条坐标待修正` : ''}${missingId ? ` · ${missingId} 条无编号` : ''}`);
      if (!quiet) showToast('数据已更新。');
      return true;
    } catch (error) {
      status(`加载失败：${friendlyError(error)}`);
      if (!quiet) showToast(`加载失败：${friendlyError(error)}`, true);
      if (!records.length) renderEmpty('数据加载失败。请检查网络、表名及读取策略，然后点击刷新。');
      return false;
    } finally {
      setLoading(false);
    }
  }

  function typeMatches(record) { return typeFilter === 'all' || record.type === typeFilter; }
  function visibleRecords() {
    const query = text(el.searchInput.value).toLocaleLowerCase();
    return records.filter(record => {
      if (!typeMatches(record)) return false;
      if (cityFilter && record.city !== cityFilter) return false;
      if (!query) return true;
      const rawValues = Object.values(record.raw).map(value => text(value)).join(' ');
      return rawValues.toLocaleLowerCase().includes(query) || record.city.includes(query);
    }).sort((a, b) => {
      if (a.type !== b.type) return a.type === 'factory' ? -1 : 1;
      return a.city.localeCompare(b.city, 'zh-CN') || a.name.localeCompare(b.name, 'zh-CN');
    });
  }
  function renderChips() {
    const counts = new Map();
    for (const record of records.filter(typeMatches)) {
      counts.set(record.city, (counts.get(record.city) || 0) + 1);
    }
    if (cityFilter && !counts.has(cityFilter)) cityFilter = '';
    el.cityChips.replaceChildren();
    addChip('全部地区', '', [...counts.values()].reduce((sum, value) => sum + value, 0));
    [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-CN'))
      .forEach(([city, count]) => addChip(city, city, count));
  }
  function addChip(label, city, count) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `city-chip${cityFilter === city ? ' is-active' : ''}`;
    button.textContent = `${label} ${count}`;
    button.setAttribute('aria-pressed', String(cityFilter === city));
    button.addEventListener('click', () => {
      cityFilter = cityFilter === city ? '' : city;
      renderChips();
      render();
    });
    el.cityChips.appendChild(button);
  }
  function makeIcon(type) {
    return L.divIcon({
      className: 'location-div-icon',
      html: `<span class="location-marker ${type}"><span class="marker-shape" aria-hidden="true"></span></span>`,
      iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -16]
    });
  }
  function makeDetailRow(label, value) {
    const string = text(value);
    if (!string) return null;
    const row = document.createElement('div');
    row.className = 'popup-detail';
    const key = document.createElement('span');
    key.className = 'popup-key';
    key.textContent = label;
    const val = document.createElement('span');
    val.textContent = string;
    row.append(key, val);
    return row;
  }
  function popupFor(group) {
    const root = document.createElement('div');
    root.className = 'record-popup';
    if (group.length > 1) {
      const note = document.createElement('div');
      note.className = 'popup-group-note';
      note.textContent = `同一坐标有 ${group.length} 个地点`;
      root.appendChild(note);
    }
    for (const record of group) {
      const card = document.createElement('section');
      card.className = 'popup-card';
      const heading = document.createElement('h3');
      heading.textContent = `${record.type === 'dock' ? '码头' : '饲料厂'} · ${record.name}`;
      card.appendChild(heading);
      const details = record.type === 'factory'
        ? [
          ['简称', read(record.raw, 'abbreviation')], ['集团', read(record.raw, 'group_name')],
          ['地区', `${record.city} ${record.county}`.trim()], ['地址', record.address],
          ['产能', read(record.raw, 'capacity') == null ? '' : `${read(record.raw, 'capacity')} 万吨/年`],
          ['豆粕需求', read(record.raw, 'soybean_meal_demand')],
          ['豆粕来源', read(record.raw, 'soybean_meal_origin')],
          ['配送渠道', read(record.raw, 'delivery_channel')],
          ['吨运费', read(record.raw, 'freight_per_ton')], ['联系人', read(record.raw, 'Contact')]
        ]
        : [
          ['地区', record.city], ['地址', record.address],
          ['泊位', read(record.raw, 'berth')], ['泊位吨级', read(record.raw, 'berth_tonnage')]
        ];
      details.push(['坐标', `${record.lng.toFixed(6)}, ${record.lat.toFixed(6)}`]);
      for (const [label, value] of details) {
        const row = makeDetailRow(label, value);
        if (row) card.appendChild(row);
      }
      if (role === 'editor') {
        const actions = document.createElement('div');
        actions.className = 'popup-actions';
        const edit = document.createElement('button');
        edit.type = 'button'; edit.textContent = '编辑';
        edit.addEventListener('click', () => openEditor(record));
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'danger'; remove.textContent = '删除';
        remove.addEventListener('click', () => deleteRecord(record));
        actions.append(edit, remove);
        card.appendChild(actions);
      }
      root.appendChild(card);
    }
    return root;
  }
  function renderMap(rows) {
    markerLayer.clearLayers();
    markerByKey = new Map();
    const markers = [];
    for (const record of rows.filter(item => item.valid)) {
      const marker = L.marker([record.lat, record.lng], {
        icon: makeIcon(record.type), title: record.name, alt: record.name
      });
      const tooltip = document.createElement('span');
      tooltip.textContent = record.name;
      marker.bindTooltip(tooltip, { direction: 'top', offset: [0, -8] });
      marker.bindPopup(() => popupFor([record]), { maxWidth: 330, maxHeight: 360, autoPanPadding: [24, 24] });
      markers.push(marker);
      markerByKey.set(record.key, marker);
    }
    markerLayer.addLayers(markers);
  }
  function renderEmpty(message) {
    el.resultList.replaceChildren();
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = message;
    el.resultList.appendChild(empty);
    el.resultCount.textContent = '0';
    if (markerLayer) markerLayer.clearLayers();
  }
  function render() {
    const rows = visibleRecords();
    el.resultCount.textContent = String(rows.length);
    renderMap(rows);
    el.resultList.replaceChildren();
    if (!rows.length) {
      renderEmpty(records.length ? '没有符合条件的地点。' : '暂无地点数据。');
      return;
    }
    for (const record of rows) {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = `result-card${record.type === 'dock' ? ' result-card--dock' : ''}`;
      const header = document.createElement('span');
      header.className = 'result-card__header';
      const icon = document.createElement('span');
      icon.className = 'result-card__icon';
      icon.setAttribute('aria-hidden', 'true');
      const name = document.createElement('strong');
      name.className = 'result-card__name';
      name.textContent = record.name;
      const meta = document.createElement('small');
      meta.className = 'result-card__meta';
      meta.textContent = record.type === 'dock'
        ? `${record.city} · 码头作业区`
        : `${record.city}${record.county ? ` · ${record.county}` : ''}${record.abbreviation ? ` · ${record.abbreviation}` : ''}`;
      const tag = document.createElement('span');
      tag.className = 'result-card__tag';
      tag.textContent = !record.valid ? '待定位' : (record.type === 'dock' ? '码头'
        : (text(record.capacity) ? `${record.capacity} 万吨` : '饲料厂'));
      header.append(icon, name, tag);
      item.append(header, meta);
      if (record.address) {
        const address = document.createElement('span');
        address.className = 'result-card__address';
        address.textContent = record.address;
        item.appendChild(address);
      }
      item.addEventListener('click', () => {
        if (!record.valid) {
          if (role === 'editor') openEditor(record);
          else showToast('此地点坐标无效，请联系管理员修正。', true);
          return;
        }
        const marker = markerByKey.get(record.key);
        if (!marker) return;
        markerLayer.zoomToShowLayer(marker, () => marker.openPopup());
        if (window.innerWidth < 768) setPanelCollapsed(true);
      });
      el.resultList.appendChild(item);
    }
  }

  function setTypeFilter(type) {
    typeFilter = type;
    for (const [name, button] of [['all', el.tabAll], ['factory', el.tabFactory], ['dock', el.tabDock]]) {
      button.classList.toggle('is-active', name === type);
      button.setAttribute('aria-pressed', String(name === type));
    }
    renderChips();
    render();
  }
  function setPanelCollapsed(collapsed) {
    el.panel.classList.toggle('is-collapsed', collapsed);
    el.panelOpen.hidden = !collapsed;
    if (collapsed) setPanelExpanded(false);
    if (map) setTimeout(() => map.invalidateSize(), 0);
  }
  function setPanelExpanded(expanded) {
    el.panel.classList.toggle('is-expanded', expanded);
    el.sheetHandle.setAttribute('aria-expanded', String(expanded));
    el.sheetHandle.setAttribute('aria-label', expanded ? '收起地点列表' : '展开地点列表');
    if (map) setTimeout(() => map.invalidateSize(), 0);
  }

  function setFieldValues(record) {
    const rawCoords = record ? coordsFromRow(record.raw) : null;
    for (const [name, input] of Object.entries(field)) {
      if (name === 'lng') input.value = rawCoords && Number.isFinite(rawCoords.lng) ? rawCoords.lng : '';
      else if (name === 'lat') input.value = rawCoords && Number.isFinite(rawCoords.lat) ? rawCoords.lat : '';
      else if (name === 'city') input.value = record && record.type === 'factory' ? text(read(record.raw, 'city')) : '';
      else if (name === 'county') input.value = record && record.type === 'factory' ? text(read(record.raw, 'county')) : '';
      else input.value = record ? text(read(record.raw, name)) : '';
    }
  }
  function updateEditorType() {
    const factory = el.editorType.value === 'factory';
    el.factoryFields.hidden = !factory;
    el.dockFields.hidden = factory;
    el.editorTitle.textContent = `${editing ? '编辑' : '新增'}${factory ? '饲料厂' : '码头作业区'}`;
    el.editorSubmit.textContent = editing ? '保存更改' : '新增地点';
  }
  function openEditor(record = null) {
    if (role !== 'editor') return;
    editing = record;
    el.editorForm.reset();
    el.editorError.hidden = true;
    el.editorError.textContent = '';
    el.editorType.value = record ? record.type : (typeFilter === 'dock' ? 'dock' : 'factory');
    el.editorType.disabled = Boolean(record);
    el.editorId.value = record ? String(record.id) : '';
    setFieldValues(record);
    updateEditorType();
    el.editorOverlay.hidden = false;
    setTimeout(() => field.name.focus(), 0);
  }
  function closeEditor() {
    el.editorOverlay.hidden = true;
    editing = null;
    pointPicking = false;
    $('map').classList.remove('is-picking');
  }
  function databaseColumn(type, fieldName) {
    const list = columns[type];
    if (!list.length) return fieldName;
    return list.find(name => normalizedColumn(name) === normalizedColumn(fieldName)) || null;
  }
  function addPayloadValue(payload, type, name, value) {
    const column = databaseColumn(type, name);
    if (column) payload[column] = value;
  }
  function formPayload(type) {
    const lng = Number(field.lng.value), lat = Number(field.lat.value);
    if (!text(field.name.value)) throw new Error('请填写名称。');
    if (!Number.isFinite(lng) || !Number.isFinite(lat) ||
        field.lng.value.trim() === '' || field.lat.value.trim() === '') {
      throw new Error('请填写有效的经度和纬度。');
    }
    if (!isInGuangxi(lng, lat)) {
      throw new Error('坐标需位于广西行政边界内。');
    }
    const payload = {};
    addPayloadValue(payload, type, 'name', text(field.name.value));
    addPayloadValue(payload, type, 'address', text(field.address.value) || null);
    const combinedColumn = databaseColumn(type, 'Latitude_and_longitude');
    if (combinedColumn) payload[combinedColumn] = `${lng.toFixed(6)}, ${lat.toFixed(6)}`;
    else {
      addPayloadValue(payload, type, 'lng', lng);
      addPayloadValue(payload, type, 'lat', lat);
    }
    if (type === 'factory') {
      for (const name of ['city', 'county', 'abbreviation', 'group_name',
        'soybean_meal_demand', 'soybean_meal_origin', 'delivery_channel',
        'freight_per_ton', 'Contact']) {
        addPayloadValue(payload, type, name, text(field[name].value) || null);
      }
      const capacity = text(field.capacity.value);
      if (capacity && (!Number.isFinite(Number(capacity)) || Number(capacity) < 0)) {
        throw new Error('产能须为不小于 0 的数字。');
      }
      addPayloadValue(payload, type, 'capacity', capacity ? Number(capacity) : null);
    } else {
      addPayloadValue(payload, type, 'berth', text(field.berth.value) || null);
      addPayloadValue(payload, type, 'berth_tonnage', text(field.berth_tonnage.value) || null);
    }
    return payload;
  }
  function nextId(type) {
    const prefix = type === 'factory' ? 'ytw-' : 'dock-';
    const matches = records.filter(record => record.type === type)
      .map(record => text(record.id).match(new RegExp(`^${prefix}(\\d+)$`, 'i')))
      .filter(Boolean).map(match => Number(match[1]));
    const next = (matches.length ? Math.max(...matches) : 0) + 1;
    return `${prefix}${type === 'dock' ? String(next).padStart(2, '0') : next}`;
  }
  async function saveEditor(event) {
    event.preventDefault();
    if (role !== 'editor' || loading) return;
    el.editorError.hidden = true;
    const type = el.editorType.value;
    let payload;
    try { payload = formPayload(type); }
    catch (error) {
      el.editorError.textContent = friendlyError(error);
      el.editorError.hidden = false;
      return;
    }
    el.editorSubmit.disabled = true;
    el.editorSubmit.textContent = '保存中…';
    try {
      const table = type === 'factory' ? FACTORY_TABLE : DOCK_TABLE;
      let result;
      if (editing) {
        result = await client.from(table).update(payload).eq('id', editing.id).select('id');
      } else {
        addPayloadValue(payload, type, 'id', nextId(type));
        result = await client.from(table).insert(payload).select('id');
      }
      if (result.error) throw result.error;
      if (!result.data || result.data.length !== 1) {
        throw new Error('没有写入记录。请检查数据库策略或刷新后重试。');
      }
      closeEditor();
      const refreshed = await refreshData({ quiet: true });
      showToast(refreshed ? '保存成功，地图已更新。' : '保存成功，但地图刷新失败，请点击刷新。', !refreshed);
    } catch (error) {
      el.editorError.textContent = `保存失败：${friendlyError(error)}`;
      el.editorError.hidden = false;
    } finally {
      el.editorSubmit.disabled = false;
      el.editorSubmit.textContent = editing ? '保存更改' : '新增地点';
    }
  }
  async function deleteRecord(record) {
    if (role !== 'editor') return;
    if (!window.confirm(`确定删除“${record.name}”吗？此操作无法撤销。`)) return;
    try {
      const table = record.type === 'factory' ? FACTORY_TABLE : DOCK_TABLE;
      const { data, error } = await client.from(table).delete().eq('id', record.id).select('id');
      if (error) throw error;
      if (!data || data.length !== 1) throw new Error('没有删除记录。请检查数据库策略。');
      map.closePopup();
      const refreshed = await refreshData({ quiet: true });
      showToast(refreshed ? '地点已删除。' : '删除成功，但地图刷新失败，请点击刷新。', !refreshed);
    } catch (error) {
      showToast(`删除失败：${friendlyError(error)}`, true);
    }
  }

  async function getAccessRole() {
    const { data, error } = await client.rpc('map_access_role');
    if (!error) return data;
    if (error.code === 'PGRST202' || /Could not find the function/i.test(error.message || '')) {
      throw new Error('尚未配置地图访问策略。请联系管理员在 Supabase 中启用访问权限。');
    }
    throw error;
  }
  async function enterApp() {
    const { data, error } = await client.auth.getUser();
    if (error || !data || !data.user) throw error || new Error('登录会话无效。');
    role = await getAccessRole();
    if (role !== 'editor' && role !== 'viewer') {
      throw new Error('此账号尚未获准查看地图。请联系管理员授权。');
    }
    el.roleLabel.textContent = role === 'editor' ? '可编辑' : '只读';
    el.addBtn.hidden = role !== 'editor';
    el.loginOverlay.hidden = true;
    el.appShell.hidden = false;
    initMap();
    setPanelCollapsed(false);
    setPanelExpanded(false);
    setTimeout(() => map.invalidateSize(), 0);
    await refreshData({ quiet: true });
  }
  function clearApp() {
    records = [];
    recordByKey.clear();
    columns = { factory: [...EXPECTED_COLUMNS.factory], dock: [...EXPECTED_COLUMNS.dock] };
    role = 'none';
    el.loginPassword.value = '';
    el.loginOverlay.hidden = false;
    el.appShell.hidden = true;
    el.editorOverlay.hidden = true;
    if (map) { map.closePopup(); markerLayer.clearLayers(); }
    el.resultList.replaceChildren();
  }
  async function handleLogin(event) {
    event.preventDefault();
    el.loginError.hidden = true;
    let email = text(el.loginEmail.value);
    const password = el.loginPassword.value;
    if (email.toLowerCase() === 'dhly-maoyi') email = LEGACY_EDITOR_EMAIL;
    if (!email || !password) return showLoginError('请输入账号和密码。');
    el.loginSubmit.disabled = true;
    el.loginSubmit.textContent = '登录中…';
    try {
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await enterApp();
    } catch (error) {
      await client.auth.signOut();
      showLoginError(friendlyError(error));
    } finally {
      el.loginSubmit.disabled = false;
      el.loginSubmit.textContent = '登录并查看地图';
    }
  }
  async function start() {
    el.loginForm.addEventListener('submit', handleLogin);
    el.logoutBtn.addEventListener('click', async () => {
      try {
        const { error } = await client.auth.signOut();
        if (error) throw error;
        clearApp();
        showToast('已退出登录。');
      } catch (error) {
        showToast(`退出失败：${friendlyError(error)}，请重试。`, true);
      }
    });
    el.refreshBtn.addEventListener('click', () => refreshData());
    el.addBtn.addEventListener('click', () => openEditor());
    el.searchInput.addEventListener('input', render);
    el.tabAll.addEventListener('click', () => setTypeFilter('all'));
    el.tabFactory.addEventListener('click', () => setTypeFilter('factory'));
    el.tabDock.addEventListener('click', () => setTypeFilter('dock'));
    el.panelClose.addEventListener('click', () => setPanelCollapsed(true));
    el.panelOpen.addEventListener('click', () => setPanelCollapsed(false));
    el.sheetHandle.addEventListener('pointerdown', event => {
      if (window.innerWidth >= 768) return;
      sheetPointerStart = event.clientY;
      el.sheetHandle.setPointerCapture(event.pointerId);
    });
    el.sheetHandle.addEventListener('pointerup', event => {
      if (sheetPointerStart === null) return;
      const distance = event.clientY - sheetPointerStart;
      sheetPointerStart = null;
      if (Math.abs(distance) < 30) return;
      setPanelExpanded(distance < 0);
      sheetDidSwipe = true;
      setTimeout(() => { sheetDidSwipe = false; }, 0);
    });
    el.sheetHandle.addEventListener('pointercancel', () => { sheetPointerStart = null; });
    el.sheetHandle.addEventListener('click', () => {
      if (sheetDidSwipe) return;
      setPanelExpanded(!el.panel.classList.contains('is-expanded'));
    });
    el.editorCancel.addEventListener('click', closeEditor);
    $('editorCancelBottom').addEventListener('click', closeEditor);
    el.editorType.addEventListener('change', updateEditorType);
    el.editorForm.addEventListener('submit', saveEditor);
    el.pickPointBtn.addEventListener('click', () => {
      if (!map) return;
      pointPicking = true;
      el.editorOverlay.hidden = true;
      $('map').classList.add('is-picking');
      showToast('点击地图中的目标位置以填写坐标。');
    });
    el.editorOverlay.addEventListener('click', event => {
      if (event.target === el.editorOverlay) closeEditor();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !el.editorOverlay.hidden) closeEditor();
      else if (event.key === 'Escape' && pointPicking) {
        pointPicking = false;
        $('map').classList.remove('is-picking');
        el.editorOverlay.hidden = false;
      }
    });
    window.addEventListener('resize', () => { if (map) map.invalidateSize(); });
    if (!window.supabase || !window.L || !window.L.markerClusterGroup || !window.GUANGXI_BOUNDARY) {
      showLoginError('地图程序文件未完整加载。请检查地图聚合插件、vendor 和边界文件。');
      el.loginSubmit.disabled = true;
      return;
    }
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: {
        storage: window.sessionStorage, persistSession: true,
        autoRefreshToken: true, detectSessionInUrl: false
      }
    });
    client.auth.onAuthStateChange(event => {
      if (event === 'SIGNED_OUT') clearApp();
    });
    try {
      const { data: { session }, error } = await client.auth.getSession();
      if (error) throw error;
      if (session) await enterApp();
    } catch (error) {
      await client.auth.signOut();
      clearApp();
      showLoginError(friendlyError(error));
    }
  }
  start();
})();

</script>
  </body>
</html>
